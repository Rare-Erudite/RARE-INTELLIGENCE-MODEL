name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check rare_engine tests

      - name: Fast test suite
        # The real-model suite needs a 397 MB GGUF and ~16 min on 1 CPU, so it
        # is excluded here and run manually. See TEST_REPORT.md.
        run: python -m pytest -m "not requires_model" -q

      - name: Verify state files are valid
        run: python -c "import json; json.load(open('TASK_STATE.json'))"
