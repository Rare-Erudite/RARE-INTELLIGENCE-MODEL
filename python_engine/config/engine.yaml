# =============================================================================
# RARE Intelligence Engine - default configuration
#
# Selection rationale for the default model is documented in MODEL_REGISTRY.md.
# Environment variables (RARE_*) override anything here; see .env.example.
# =============================================================================

env: development
state_dir: .rare
log_level: INFO
log_format: json

# The model used when a task does not name one.
default_model: qwen3-0.6b-instruct-q4km

models:
  # --- Primary local model ---------------------------------------------------
  # Qwen3-0.6B, Apache-2.0, Q4_K_M GGUF (~379 MB on disk).
  # Chosen because this host has NO GPU and a 4 GB writable overlay: a 0.6B
  # Q4 model is the largest that leaves headroom for the OS, Python and the
  # task database. See MODEL_REGISTRY.md for the full matrix.
  qwen3-0.6b-instruct-q4km:
    id: qwen3-0.6b-instruct-q4km
    adapter: llamacpp
    model_ref: models/Qwen3-0.6B-Q4_K_M.gguf
    display_name: Qwen3 0.6B Instruct (Q4_K_M, GGUF)
    context_window: 4096
    max_tokens: 512
    temperature: 0.2
    top_p: 0.95
    n_threads: 0        # 0 = auto
    n_gpu_layers: 0     # CPU only on this host
    stop: []
    notes: >
      Apache-2.0. Upstream: Qwen/Qwen3-0.6B. GGUF quantisation by unsloth.
      Thinking mode is disabled by the engine's system prompt to keep latency
      predictable on CPU.

  # --- Deterministic adapter for tests / offline CI --------------------------
  echo:
    id: echo
    adapter: echo
    model_ref: echo
    display_name: Deterministic echo (tests only)
    context_window: 8192
    max_tokens: 512
    notes: >
      NOT a language model. Used by the test suite and offline CI so the
      orchestrator can be exercised without weights or network. Excluded from
      all benchmark claims.

orchestrator:
  task_timeout_s: 900
  model_timeout_s: 180
  max_steps: 24
  max_retries: 2
  retry_backoff_s: 1.5
  max_model_calls: 40
  max_tool_calls: 60

tools:
  allowlist: []          # empty = all registered tools
  sandbox_root: .rare/sandbox
  enable_shell: false
  shell_timeout_s: 60
  max_output_chars: 20000

integration_enabled: false
