name: Python Engine CI

# The Python engine lives in python_engine/ and is independent of the
# TypeScript app. It is tested on its own so a Python regression is never
# masked by a green TypeScript run, and vice versa.

on:
  push:
    branches: ['**']
    paths:
      - 'python_engine/**'
      - '.github/workflows/python-engine-ci.yml'
  pull_request:
    paths:
      - 'python_engine/**'
      - '.github/workflows/python-engine-ci.yml'
  workflow_dispatch:

concurrency:
  group: py-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    defaults:
      run:
        working-directory: python_engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python_engine/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # The service layer needs FastAPI + a test client. Kept out of the
          # core install so the engine stays usable without a web stack.
          pip install "fastapi>=0.110" "uvicorn>=0.29" "httpx>=0.27"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Tests
        # requires_model tests need a downloaded GGUF and are excluded here;
        # they are run manually and recorded in TEST_REPORT.md.
        run: pytest -m "not requires_model" -q

      - name: Verify service imports
        run: python -c "import rare_engine.service; print('service OK')"

  state-files:
    name: State files valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: TASK_STATE.json parses
        run: python -c "import json;json.load(open('python_engine/TASK_STATE.json'));print('TASK_STATE.json OK')"
