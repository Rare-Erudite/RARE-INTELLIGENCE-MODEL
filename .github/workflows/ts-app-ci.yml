name: TypeScript App CI

# Builds, type-checks and tests the TypeScript application. The Python engine
# is covered separately by python-engine-ci.yml.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ts-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / build / test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Build (vite)
        run: npm run build

      - name: Tests
        run: npm test

      # Job queue + engine route tests. Separate step so a failure here is
      # distinguishable from a failure in the engine's own suite.
      - name: Job queue & engine route tests
        run: npm run test:jobs
